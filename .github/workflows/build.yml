name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
      - run: |
          mv android android_old
          flutter create --platforms=android --project-name whatsup .
          cp android_old/app/google-services.json android/app/ 2>/dev/null || true
          cp -r android_old/app/src/main/res/mipmap-* android/app/src/main/res/ 2>/dev/null || true
      - run: flutter pub get
      - run: |
          for f in $(find $HOME/.pub-cache/hosted -path "*/android/build.gradle"); do
            if ! grep -q "namespace" "$f"; then
              d=$(dirname $(dirname "$f"))
              m="$d/android/src/main/AndroidManifest.xml"
              pkg=$(grep -o 'package="[^"]*"' "$m" | head -1 | cut -d'"' -f2)
              if [ -n "$pkg" ]; then
                sed -i "/^android {/a\\    namespace \"$pkg\"" "$f"
                echo "fixed $f -> $pkg"
              fi
            fi
          done
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
