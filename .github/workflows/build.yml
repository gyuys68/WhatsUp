name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          mv android android_old
          flutter create --platforms=android --project-name whatsup .
          cp android_old/app/google-services.json android/app/ 2>/dev/null || true
          cp -r android_old/app/src/main/res/mipmap-* android/app/src/main/res/ 2>/dev/null || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
